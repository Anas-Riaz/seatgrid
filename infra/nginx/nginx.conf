worker_processes auto;

events {
  worker_connections 8192;
}

http {
  # Docker's DNS: "api" resolves to every coordinator replica.
  resolver 127.0.0.11 valid=5s;

  # First layer of traffic protection. Limits are generous because load tests
  # come from a single IP; the coordinators add per-user token buckets on top.
  limit_req_zone  $binary_remote_addr zone=per_ip:10m rate=2000r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  upstream coordinators {
    zone coordinators 64k;
    # Round-robin (the default). Passive health check: a coordinator that fails
    # repeatedly is taken out of rotation for a few seconds. Timeouts count as
    # failures too, so the threshold is high enough that a merely busy (but
    # load-shedding) coordinator stays in rotation; a dead one fails instantly.
    server api:4000 resolve max_fails=20 fail_timeout=5s;
    keepalive 128;
  }

  upstream web_ui {
    server web:80;
  }

  log_format main '$remote_addr "$request" $status coordinator=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;

    location /api/ {
      limit_req  zone=per_ip burst=4000 nodelay;
      limit_conn conn_per_ip 3000;

      proxy_pass http://coordinators;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      # Safe to retry on another coordinator only when the request never reached one.
      proxy_next_upstream error;
    }

    location /health {
      proxy_pass http://coordinators;
    }

    location / {
      proxy_pass http://web_ui;
    }
  }
}
